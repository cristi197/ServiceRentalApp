<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programare Service Auto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px;
      max-width: 600px;
      width: 100%;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s ease;
      font-family: inherit;
      background: #f8f9fa;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #999;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 20px;
      padding-right: 40px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
    }

    .info-box {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-top: 25px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .info-box strong {
      color: #667eea;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px;
      }

      .header h1 {
        font-size: 24px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .form-row .form-group {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🚗 Service Auto</h1>
    <p>Programează-ți vizita în doar câțiva pași</p>
  </div>

  <form id="bookingForm">
    <div class="form-row">
      <div class="form-group">
        <label for="nume">Nume</label>
        <input type="text" placeholder="Ionescu" id="nume" required />
      </div>
      <div class="form-group">
        <label for="prenume">Prenume</label>
        <input type="text" placeholder="Ion" id="prenume" required />
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" placeholder="ion@example.com" id="email" required />
    </div>

    <div class="form-group">
      <label for="telefon">Telefon</label>
      <input type="tel" placeholder="+40 712 345 678" id="telefon" required />
    </div>

    <div class="form-group">
      <label for="date">Data Programării</label>
      <input type="text" id="date" placeholder="Selectează data" required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="startHour">Ora de Start</label>
        <select id="startHour" required></select>
      </div>
      <div class="form-group">
        <label for="duration">Durata</label>
        <select id="duration" required>
          <option value="1">1 oră</option>
          <option value="2">2 ore</option>
          <option value="3">3 ore</option>
        </select>
      </div>
    </div>

    <button type="submit">📅 Programează</button>
  </form>

  <div class="info-box">
    ✅ <strong>Confirmarea</strong> va fi trimisă pe email-ul tău imediat după programare.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="app.js"></script>

</body>
</html>
